# ==========================================================
# TrackDue Application Configuration
# ==========================================================
spring.application.name=trackdue
server.port=8080

# ==========================================================
# MySQL Database Configuration (Connected to MySQL Workbench)
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/trackdue_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Dil@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

