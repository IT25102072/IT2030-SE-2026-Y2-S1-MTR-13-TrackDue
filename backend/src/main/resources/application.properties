# ==========================================================
# TrackDue Application Configuration
# ==========================================================
spring.application.name=trackdue
server.port=8080

# ==========================================================
# Database Configuration (MySQL 8.0 on port 3306)
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/trackdue_app_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

